name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Тесты и линт (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pydub werkzeug waitress ruff==0.17.3

      - name: Линт (ruff)
        run: ruff check .

      - name: Юнит-тесты
        run: python -m unittest discover -s tests -v

      - name: Проверка синтаксиса фронтенда
        run: |
          for file in templates/*.js; do node --check "$file"; done

  build:
    name: Сборка exe (Windows, только теги)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r req.txt pyinstaller

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/cutline.spec

      - name: Упаковка в zip
        run: Compress-Archive -Path dist/Cutline -DestinationPath "Cutline-portable-${{ github.ref_name }}-win64.zip" -Force

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: Cutline-windows
          path: dist/Cutline

      - name: Публикация в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: Cutline-portable-*-win64.zip
          generate_release_notes: true

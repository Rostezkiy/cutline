<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Cutline — запуск…</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #17181b;
            color: #e9eaec;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .box {
            text-align: center;
            max-width: 460px;
            padding: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 8px;
            letter-spacing: .5px;
        }

        p {
            margin: 8px 0;
            color: #9a9ea8;
            font-size: 14px;
            line-height: 1.5;
        }

        .spinner {
            width: 34px;
            height: 34px;
            margin: 18px auto 6px;
            border: 3px solid #2a2c31;
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        code {
            background: #22242a;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="spinner"></div>
        <h1>Cutline запускается</h1>
        <p>Поднимаем локальный сервер и проверяем окружение. Обычно это занимает пару секунд,
            первый запуск с загрузкой модели — дольше.</p>
        <p>Если окно не переключилось на интерфейс, откройте <code>http://127.0.0.1:5000</code>
            вручную или посмотрите <code>logs/cutline.log</code>.</p>
    </div>
</body>

</html>

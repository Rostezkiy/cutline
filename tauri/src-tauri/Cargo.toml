[package]
name = "cutline-desktop"
version = "1.0.0"
description = "Cutline — настольная оболочка для локального сервера Cutline"
authors = ["R057"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
